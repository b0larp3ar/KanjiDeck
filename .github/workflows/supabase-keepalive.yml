name: Supabase Keep Alive

on:
  schedule:
    - cron: '0 */12 * * *'

  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase Database
        run: |
          response=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/user_progress?select=*&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")

          echo "$response"

          if ! echo "$response" | grep -q "HTTP_STATUS:200"; then
            echo "Supabase ping failed!"
            exit 1
          fi